name: Beta CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean test suite
        run: ./gradlew clean test

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || '' }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" HEAD
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA" HEAD
          elif [[ -n "$DEFAULT_BRANCH" ]] \
            && git cat-file -e "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            start_sha="$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" HEAD || true)"
            if [[ -n "$start_sha" && "$start_sha" != "$(git rev-parse HEAD)" ]]; then
              git diff --check "$start_sha" HEAD
            elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              empty_tree="$(git hash-object -t tree /dev/null)"
              git diff --check "$empty_tree" HEAD
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" HEAD
          fi

      - name: Enforce account-index privacy
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '\b(getConfiguration|setConfiguration)\b|semanticbanksearch\.index|\bSTORAGE_KEY\b' src/main/java/com/semanticbanksearch; then
            echo "Observed bank indexes must not use ConfigManager; legacy unset cleanup remains permitted."
            exit 1
          fi

      - name: Enforce runtime safety contract
        shell: bash
        run: |
          if rg -n 'https?://|Socket|Robot|MenuEntry|setMenuEntries|invokeMenuAction|withdraw|deposit|ProcessBuilder|ClassLoader|java\.lang\.reflect' src/main/java; then
            echo "Unexpected networking, automation, menu action, process, classloader, or reflection code found."
            exit 1
          fi

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
