name: Beta CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean test suite
        run: ./gradlew clean test

      - name: Check patch whitespace
        run: git diff --check HEAD

      - name: Enforce runtime safety contract
        shell: bash
        run: |
          if rg -n 'https?://|Socket|Robot|MenuEntry|setMenuEntries|invokeMenuAction|withdraw|deposit|ProcessBuilder|ClassLoader|java\.lang\.reflect' src/main/java; then
            echo "Unexpected networking, automation, menu action, process, classloader, or reflection code found."
            exit 1
          fi

      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
